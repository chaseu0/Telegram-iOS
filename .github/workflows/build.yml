name: CI

on:
  push:
    branches:
      - chaseu0-patch-1
      - patch-1
  workflow_dispatch:

concurrency:
  group: telegram-ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Fast pre-build gate (~2-5 min). Fails before the ~60 min compile when config is wrong.
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install yasm cmake || true

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "Required Xcode: ${XCODE_VERSION}"
          SELECTED=""
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" \
            "/Applications/Xcode_${XCODE_VERSION}.0.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              SELECTED="$candidate"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "No suitable Xcode found. Installed apps:"
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Validate build configuration
        run: |
          set -euo pipefail
          CONFIG="build-system/appstore-configuration.json"
          python3 - <<'PY'
          import json, sys
          path = "build-system/appstore-configuration.json"
          with open(path) as f:
              cfg = json.load(f)
          required = [
              "sg_config", "bundle_id", "api_id", "api_hash", "team_id",
              "app_center_id", "is_internal_build", "is_appstore_build",
              "appstore_id", "app_specific_url_scheme", "premium_iap_product_id",
              "enable_siri", "enable_icloud",
          ]
          missing = [k for k in required if k not in cfg]
          if missing:
              print(f"Missing keys in {path}: {missing}")
              sys.exit(1)
          if cfg["enable_siri"]:
              print("enable_siri must be false for personal-cert sideload (crashes INPreferences)")
              sys.exit(1)
          if cfg["enable_icloud"]:
              print("enable_icloud must be false for personal-cert sideload")
              sys.exit(1)
          if not cfg["bundle_id"] or not cfg["api_id"] or not cfg["api_hash"]:
              print("bundle_id, api_id, and api_hash are required")
              sys.exit(1)
          print(f"Config OK: bundle_id={cfg['bundle_id']} enable_siri={cfg['enable_siri']} enable_icloud={cfg['enable_icloud']}")
          PY
          python3 build-system/Make/Make.py --help >/dev/null
          test -f build-system/fake-codesigning/certs/SelfSigned.p12
          test -f build-system/fake-codesigning/profiles/Telegram.mobileprovision

      - name: Resolve Bazel configuration and query targets
        run: |
          set -euo pipefail
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            query \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --queryArgs="kind('ios_application rule', //Telegram:all) + //Telegram:Swiftgram"
          VARS="build-input/configuration-repository/variables.bzl"
          if ! grep -q 'telegram_enable_siri = False' "$VARS"; then
            echo "Expected telegram_enable_siri = False in $VARS"
            cat "$VARS"
            exit 1
          fi
          if ! grep -q 'telegram_enable_icloud = False' "$VARS"; then
            echo "Expected telegram_enable_icloud = False in $VARS"
            cat "$VARS"
            exit 1
          fi
          echo "variables.bzl entitlements flags OK"

  build:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install yasm cmake || true

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "Required Xcode: ${XCODE_VERSION}"
          SELECTED=""
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" \
            "/Applications/Xcode_${XCODE_VERSION}.0.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              SELECTED="$candidate"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "No suitable Xcode found. Installed apps:"
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build unsigned IPA
        id: build
        run: |
          set -euo pipefail

          # Stable absolute paths keep Bazel action keys consistent across CI runs.
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(tr -d '\r\n' < build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

          # Fake codesigning (SelfSigned.p12 + bundled profiles) - no Apple secrets required.
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          # disableExtensions: sideload-friendly IPA without app extensions.
          # --cacheDir + --jobs: reuse disk cache and use all host CPUs (set in Make.py).
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          IPA_SRC="$SOURCE_DIR/bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$IPA_SRC" ]; then
            echo "No Swiftgram.ipa at $IPA_SRC; listing candidates:"
            find bazel-bin bazel-out -name '*.ipa' -print 2>/dev/null || true
            exit 1
          fi
          cp "$IPA_SRC" "$OUTPUT_PATH/SweetGram.ipa"
          echo "ipa_path=$OUTPUT_PATH/SweetGram.ipa" >> "$GITHUB_OUTPUT"

          ls -lah "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SweetGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/SweetGram.ipa
          if-no-files-found: error
          retention-days: 14
