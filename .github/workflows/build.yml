name: CI

on:
  push:
    branches:
      - chaseu0-patch-1
      - patch-1
  workflow_dispatch:

concurrency:
  group: telegram-ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Xcode 26.2 (see versions.json) is on macos-15 and macos-26 images.
    # macos-13/14 are deprecated and do not ship Xcode 26.x.
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install yasm cmake || true

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "Required Xcode: ${XCODE_VERSION}"
          SELECTED=""
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" \
            "/Applications/Xcode_${XCODE_VERSION}.0.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              SELECTED="$candidate"
              break
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "No suitable Xcode found. Installed apps:"
            ls -1 /Applications | grep -i Xcode || true
            exit 1
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build unsigned IPA
        id: build
        run: |
          set -euo pipefail

          # Stable absolute paths keep Bazel action keys consistent across CI runs.
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(tr -d '\r\n' < build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

          # Fake codesigning (SelfSigned.p12 + bundled profiles) - no Apple secrets required.
          # API credentials are embedded in build-system/appstore-configuration.json
          # (api_id 8 / api_hash from upstream Telegram-iOS & Swiftgram public configs).
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="$SOURCE_DIR/build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          # Swiftgram fork: Make.py builds //Telegram:Swiftgram -> bazel-bin/Telegram/Swiftgram.ipa
          IPA_SRC="$SOURCE_DIR/bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$IPA_SRC" ]; then
            echo "No Swiftgram.ipa at $IPA_SRC; listing candidates:"
            find bazel-bin bazel-out -name '*.ipa' -print 2>/dev/null || true
            exit 1
          fi
          cp "$IPA_SRC" "$OUTPUT_PATH/Swiftgram.ipa"
          echo "ipa_path=$OUTPUT_PATH/Swiftgram.ipa" >> "$GITHUB_OUTPUT"

          mkdir -p "$SOURCE_DIR/build/DSYMs"
          shopt -s nullglob
          for f in "$SOURCE_DIR"/bazel-bin/Telegram/*.dSYM; do
            cp -R "$f" "$SOURCE_DIR/build/DSYMs/"
          done
          if [ -d "$SOURCE_DIR/build/DSYMs" ] && [ "$(ls -A "$SOURCE_DIR/build/DSYMs")" ]; then
            (cd "$SOURCE_DIR/build" && zip -r "$OUTPUT_PATH/Swiftgram.DSYMs.zip" DSYMs >/dev/null)
          fi

          ls -lah "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Swiftgram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Swiftgram-DSYMs-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Swiftgram.DSYMs.zip
          if-no-files-found: ignore
          retention-days: 14
