name: CI

on:
  push:
    branches:
      - chaseu0-patch-1
      - patch-1
  workflow_dispatch:

concurrency:
  group: telegram-ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BAZEL_CACHE_DIR: /Users/Shared/bazel-cache
  CACHE_VERSION: v2

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install yasm cmake || true

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          echo "Required Xcode: ${XCODE_VERSION}"
          for candidate in \
            "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer" \
            "/Applications/Xcode_${XCODE_VERSION}.0.app/Contents/Developer" \
            "/Applications/Xcode.app/Contents/Developer"; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"; break
            fi
          done
          xcodebuild -version

      - name: Restore Bazel disk cache
        id: cache-bazel-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-disk-cache-macos26-xcode262-${{ env.CACHE_VERSION }}

      - name: Prepare cache directory
        run: |
          set -euo pipefail
          sudo mkdir -p ${{ env.BAZEL_CACHE_DIR }}
          sudo chown -R $USER:staff ${{ env.BAZEL_CACHE_DIR }}

      - name: Validate SweetGram AI modules
        run: |
          set -euo pipefail
          for mod in SweetGramCore SweetGramAI SweetGramIntegration SweetGramUIHooks; do
            test -f "submodules/${mod}/BUILD" || { echo "Missing ${mod}/BUILD"; exit 1; }
          done
          test -f Swiftgram/SweetGramTelegramUIHooks/BUILD
          echo "All SweetGram AI modules present"

      - name: Build unsigned IPA with dSYMs
        id: build
        run: |
          set -euo pipefail

          BUILD_NUMBER_OFFSET="$(tr -d '\r\n' < build_number_offset)"
          APP_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          BUILD_NUMBER=$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER  App version: $APP_VERSION"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs

          python3 -u build-system/Make/Make.py \
            --cacheDir="${{ env.BAZEL_CACHE_DIR }}" \
            --overrideXcodeVersion \
            --overrideBazelVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --disableExtensions

          # Collect artifacts at a well-known absolute path
          OUTPUT_PATH="$RUNNER_TEMP/build-artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          # Collect IPA from the workspace root
          IPA_SRC="$GITHUB_WORKSPACE/bazel-bin/Telegram/Swiftgram.ipa"
          if [ ! -f "$IPA_SRC" ]; then
            echo "No Swiftgram.ipa at $IPA_SRC; searching..."
            find "$GITHUB_WORKSPACE/bazel-bin" "$GITHUB_WORKSPACE/bazel-out" -name '*.ipa' -print 2>/dev/null || true
            exit 1
          fi
          cp "$IPA_SRC" "$OUTPUT_PATH/SweetGram.ipa"
          echo "ipa_path=$OUTPUT_PATH/SweetGram.ipa" >> "$GITHUB_OUTPUT"

          # Collect dSYMs from bazel-bin (where Bazel places them)
          DSYM_DIR="$OUTPUT_PATH/DSYMs"
          mkdir -p "$DSYM_DIR"
          for f in $(find "$GITHUB_WORKSPACE/bazel-bin/Telegram" -name '*.dSYM' -type d 2>/dev/null); do
            cp -R "$f" "$DSYM_DIR/" 2>/dev/null || true
          done
          if [ -d "$DSYM_DIR" ] && [ "$(ls -A "$DSYM_DIR" 2>/dev/null)" ]; then
            cd "$OUTPUT_PATH" && zip -r "SweetGram.dSYMs.zip" DSYMs -q
            echo "dsyms_path=$OUTPUT_PATH/SweetGram.dSYMs.zip" >> "$GITHUB_OUTPUT"
            ls -lah "$OUTPUT_PATH/SweetGram.dSYMs.zip"
          else
            echo "No dSYMs found"
          fi

          ls -lah "$OUTPUT_PATH"

      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-disk-cache-macos26-xcode262-${{ env.CACHE_VERSION }}-${{ github.run_id }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SweetGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/build-artifacts/SweetGram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SweetGram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}-dSYMs
          path: ${{ runner.temp }}/build-artifacts/SweetGram.dSYMs.zip
          if-no-files-found: warn
          retention-days: 14
